<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Ring Gradients -->
    <linearGradient id="outerRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="100%" stop-color="#0088CC" />
    </linearGradient>
    <linearGradient id="middleRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="centerCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE80A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Group for Target & Text -->
  <g transform="translate(0, -20)">
    <!-- Outer Cyan Circle -->
    <circle cx="250" cy="230" r="185" fill="url(#outerRingGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#dropGlow)" />

    <!-- Outer Ring Text Path: ACHIEVE (top left) & INSPIRE (top right) & MAINTAIN (bottom) -->
    <!-- Text: ACHIEVE -->
    <g font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="3">
      <!-- ACHIEVE along curve -->
      <path id="achievePath" d="M 120 290 A 155 155 0 0 1 180 120" fill="none" />
      <text fill="#FFFFFF">
        <textPath href="#achievePath" startOffset="50%" text-anchor="middle">ACHIEVE</textPath>
      </text>

      <!-- INSPIRE along curve -->
      <path id="inspirePath" d="M 320 120 A 155 155 0 0 1 380 290" fill="none" />
      <text fill="#FFFFFF">
        <textPath href="#inspirePath" startOffset="50%" text-anchor="middle">INSPIRE</textPath>
      </text>

      <!-- MAINTAIN along bottom curve -->
      <path id="maintainPath" d="M 140 330 A 155 155 0 0 0 360 330" fill="none" />
      <text fill="#FFFFFF">
        <textPath href="#maintainPath" startOffset="50%" text-anchor="middle">MAINTAIN</textPath>
      </text>
    </g>

    <!-- Middle Dark Blue Ring -->
    <circle cx="250" cy="230" r="125" fill="url(#middleRingGrad)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Center Indigo/Navy Core -->
    <circle cx="250" cy="230" r="82" fill="url(#centerCircleGrad)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Diagonal Golden Arrow Passing Through -->
    <g filter="url(#dropGlow)">
      <!-- Arrow Shaft -->
      <path d="M 60 410 L 415 65" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round" />
      <path d="M 60 410 L 415 65" stroke="#000000" stroke-width="1.5" fill="none" opacity="0.6"/>

      <!-- Arrow Head (Top Right) -->
      <polygon points="445,35 375,65 410,105" fill="url(#arrowGrad)" stroke="#000000" stroke-width="1.5" />

      <!-- Arrow Fletching / Tail (Bottom Left) -->
      <polygon points="35,435 60,375 75,410 115,395 90,455 55,440" fill="url(#arrowGrad)" stroke="#000000" stroke-width="1.5" />
    </g>

    <!-- Center Text: AIM -->
    <text x="250" y="248" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      AIM
    </text>
  </g>

  <!-- Bottom Brand Text: AIM CHESS ACADEMY -->
  <text x="250" y="475" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#042047" text-anchor="middle" letter-spacing="2">
    AIM CHESS ACADEMY
  </text>
</svg>
